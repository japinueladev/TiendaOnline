services:
  mysql:
    image: mysql:8.4
    container_name: finanzas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [finanzas_net]

  mongodb:
    image: mongo:8
    container_name: finanzas_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_HOST_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [finanzas_net]

  importer:
    build: ./importer
    container_name: finanzas_importer
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_COLLECTION: ${MONGO_COLLECTION}
      SCAN_INTERVAL: ${SCAN_INTERVAL}
    volumes:
      - ./data/entrada:/app/data/entrada
      - ./data/procesados:/app/data/procesados
      - ./data/errores:/app/data/errores
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks: [finanzas_net]

  jupyter:
    image: quay.io/jupyter/scipy-notebook:latest
    container_name: finanzas_jupyter
    restart: unless-stopped
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_COLLECTION: ${MONGO_COLLECTION}
    command: >
      bash -c "pip install --quiet PyMySQL==1.1.1 cryptography pymongo
      && start-notebook.py --NotebookApp.token=$${JUPYTER_TOKEN}"
    ports:
      - "${JUPYTER_HOST_PORT}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks: [finanzas_net]

volumes:
  mysql_data:
  mongodb_data:

networks:
  finanzas_net:
    driver: bridge
